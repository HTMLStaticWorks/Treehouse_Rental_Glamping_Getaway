<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Arboria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/images/hero-bg.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            color: white;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.6); }
        .navbar-brand { justify-content: center; width: 100%; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <div class="text-center mb-5">
            <a href="index.html" class="navbar-brand text-white fs-2 fw-bold d-flex">
                <i class="bi bi-tree-fill text-accent"></i> ARBORIA
            </a>
            <p class="opacity-75 mt-2">Welcome back to the canopy.</p>
        </div>
        <form>
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control py-2" placeholder="name@example.com">
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-bold mb-0">Password</label>
                    <a href="#" class="small text-decoration-none" style="color: #0d6efd;">Forgot?</a>
                </div>
                <input type="password" class="form-control py-2" placeholder="••••••••">
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="termsCheck">
                <label class="form-check-label small opacity-75" for="termsCheck">I agree to the <a href="#" class="text-accent text-decoration-none">Terms and Conditions</a></label>
            </div>
            <a href="dashboard.html" class="btn btn-primary w-100 py-3 fw-bold">Sign In</a>
            <div class="text-center mt-4">
                <p class="small opacity-75">Don't have an account? <a href="register.html" class="text-accent text-decoration-none fw-bold">Register</a></p>
            </div>
            <hr class="my-4 opacity-25">
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-light btn-sm py-2"><i class="bi bi-google me-2"></i> Continue with Google</button>
            </div>
        </form>
    </div>
</body>
</html>
