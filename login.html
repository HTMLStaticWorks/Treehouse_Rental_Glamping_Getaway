<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Anti-FOUC: apply saved theme/RTL before first paint -->
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
            var d = localStorage.getItem('dir');
            if (d) document.documentElement.setAttribute('dir', d);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Arboria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: radial-gradient(circle at center, #264b3c 0%, #1a2f26 100%);
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            color: white;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.6); }
        .navbar-brand { justify-content: center; width: 100%; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <div class="text-center mb-5">
            <a href="index.html" class="navbar-brand text-white fs-2 fw-bold d-flex">
                <i class="bi bi-tree-fill text-accent"></i> ARBORIA
            </a>
            <p class="opacity-75 mt-2">Welcome back to the canopy.</p>
        </div>
        <form>
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control py-2" placeholder="name@example.com">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" class="form-control py-2" placeholder="••••••••">
            </div>
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small opacity-75" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="small text-accent text-decoration-none fw-bold">Forgot Password?</a>
            </div>
            <a href="dashboard.html" class="btn btn-primary w-100 py-3 fw-bold mb-4">Sign In</a>
            <div class="text-center">
                <p class="small opacity-75">Don't have an account? <a href="register.html" class="text-accent text-decoration-none fw-bold">Register</a></p>
            </div>
            <hr class="my-4 opacity-25">
            <div class="row g-2">
                <div class="col-6">
                    <button type="button" class="btn btn-outline-light w-100 btn-sm py-2 d-flex align-items-center justify-content-center">
                        <i class="bi bi-google me-2"></i> Google
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-outline-light w-100 btn-sm py-2 d-flex align-items-center justify-content-center">
                        <i class="bi bi-apple me-2"></i> Apple
                    </button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
