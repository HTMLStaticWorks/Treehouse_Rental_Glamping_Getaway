<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Treetops Treehouse Rental</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100 bg-light-subtle" style="background: linear-gradient(rgba(6, 95, 70, 0.55), rgba(6, 95, 70, 0.55)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="navbar-brand fs-2 mb-3 d-inline-block">
                            <i class="bi bi-tree-fill"></i>
                            <span>TREETOPS</span>
                        </a>
                        <h3>Welcome Back</h3>
                        <p class="text-muted small">Sign in to manage your bookings and saved stays.</p>
                    </div>

                    <div class="social-auth-grid mb-3">
                        <button type="button" class="social-auth-btn google">
                            <span class="social-auth-mark">G</span>
                            <span>Google</span>
                        </button>
                        <button type="button" class="social-auth-btn apple">
                            <i class="bi bi-apple"></i>
                            <span>Apple</span>
                        </button>
                    </div>
                    <div class="social-auth-divider">or continue with email</div>

                    <form action="#" method="post" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small text-accent fw-bold">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In</button>
                        <div class="text-center">
                            <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-bold">Create one</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
