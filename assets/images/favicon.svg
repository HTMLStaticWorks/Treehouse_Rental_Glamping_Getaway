<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#14291e"/>

  <!-- Tree trunk -->
  <rect x="238" y="330" width="36" height="120" rx="8" fill="#c9a84c"/>

  <!-- Lower foliage canopy -->
  <ellipse cx="256" cy="310" rx="110" ry="70" fill="#1e5c38"/>

  <!-- Middle foliage canopy -->
  <ellipse cx="256" cy="250" rx="90" ry="65" fill="#256b43"/>

  <!-- Upper foliage canopy -->
  <ellipse cx="256" cy="195" rx="70" ry="58" fill="#2d8050"/>

  <!-- Treehouse platform -->
  <rect x="200" y="290" width="112" height="12" rx="4" fill="#c9a84c"/>

  <!-- Treehouse cabin body -->
  <rect x="210" y="230" width="92" height="62" rx="6" fill="#8b5e3c"/>

  <!-- Cabin roof -->
  <polygon points="196,232 256,185 316,232" fill="#c9a84c"/>

  <!-- Cabin door -->
  <rect x="244" y="260" width="24" height="32" rx="4" fill="#5a3820"/>

  <!-- Glowing window left -->
  <rect x="216" y="244" width="22" height="18" rx="3" fill="#ffe082"/>
  <!-- Window warm glow effect -->
  <rect x="216" y="244" width="22" height="18" rx="3" fill="#ffcc00" opacity="0.35"/>

  <!-- Glowing window right -->
  <rect x="274" y="244" width="22" height="18" rx="3" fill="#ffe082"/>
  <rect x="274" y="244" width="22" height="18" rx="3" fill="#ffcc00" opacity="0.35"/>

  <!-- Small chimney -->
  <rect x="290" y="195" width="14" height="28" rx="3" fill="#7a4a2a"/>
  <!-- Smoke puff -->
  <circle cx="297" cy="185" r="7" fill="#e0d0c0" opacity="0.5"/>
  <circle cx="302" cy="175" r="5" fill="#e0d0c0" opacity="0.35"/>

  <!-- Stars / sparkles -->
  <circle cx="90"  cy="90"  r="3" fill="#ffe082" opacity="0.8"/>
  <circle cx="420" cy="75"  r="2" fill="#ffe082" opacity="0.7"/>
  <circle cx="440" cy="140" r="3" fill="#ffe082" opacity="0.6"/>
  <circle cx="70"  cy="160" r="2" fill="#ffe082" opacity="0.6"/>
  <circle cx="390" cy="400" r="2" fill="#ffe082" opacity="0.5"/>
  <circle cx="120" cy="420" r="3" fill="#ffe082" opacity="0.4"/>
</svg>
