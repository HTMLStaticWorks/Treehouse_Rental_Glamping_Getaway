<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Stay | Arboria Luxury Retreats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-tree-fill text-accent"></i><span>ARBORIA</span></a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-5">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h3 class="mb-4">1. Select Your Stay</h3>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Check-in</label>
                            <input type="date" class="form-control" value="2026-05-20">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Check-out</label>
                            <input type="date" class="form-control" value="2026-05-25">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Cabin Type</label>
                            <select class="form-select">
                                <option selected>The Sequoia Suite</option>
                                <option>Pine Crest A-Frame</option>
                                <option>Starry Night Dome</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Guests</label>
                            <select class="form-select">
                                <option>1 Guest</option>
                                <option selected>2 Guests</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h3 class="mb-4">2. Guest Information</h3>
                    <form class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">First Name</label>
                            <input type="text" class="form-control" placeholder="John">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Last Name</label>
                            <input type="text" class="form-control" placeholder="Doe">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Email</label>
                            <input type="email" class="form-control" placeholder="john@example.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Phone</label>
                            <input type="tel" class="form-control" placeholder="+1 (555) 000-0000">
                        </div>
                    </form>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h3 class="mb-4">3. Payment Method</h3>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="payment" id="creditCard" checked>
                        <label class="form-check-label" for="creditCard">Credit/Debit Card</label>
                    </div>
                    <div class="row g-3">
                        <div class="col-12">
                            <input type="text" class="form-control" placeholder="Card Number">
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" placeholder="MM / YY">
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" placeholder="CVC">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
                    <h4 class="mb-4">Booking Summary</h4>
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <img src="assets/images/cabin-1.png" class="rounded-3" width="80" height="60" style="object-fit: cover;">
                        <div>
                            <h6 class="mb-0">The Sequoia Suite</h6>
                            <p class="small text-muted mb-0">May 20 - May 25 (5 nights)</p>
                        </div>
                    </div>
                    <hr class="my-3 opacity-10">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Rate per night</span>
                        <span>$299.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Service Fee</span>
                        <span>$120.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax (10%)</span>
                        <span>$161.50</span>
                    </div>
                    <hr class="my-3 opacity-10">
                    <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                        <span>Total Price</span>
                        <span class="text-primary">$1,776.50</span>
                    </div>
                    <a href="dashboard.html" class="btn btn-primary w-100 py-3">Confirm Booking</a>
                    <p class="text-center small text-muted mt-3 mb-0"><i class="bi bi-shield-lock"></i> Secure checkout powered by Stripe</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
