<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Anti-FOUC: apply saved theme/RTL before first paint -->
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
            var d = localStorage.getItem('dir');
            if (d) document.documentElement.setAttribute('dir', d);
        })();
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Arboria Luxury Retreats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        .gallery-item {
            margin-bottom: 24px;
            overflow: hidden;
            border-radius: var(--border-radius);
            cursor: pointer;
        }
        .gallery-item img {
            transition: var(--transition);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-xl fixed-top navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-tree-fill text-accent"></i><span>ARBORIA</span></a>
        </div>
    </nav>

    <header class="bg-primary text-white pt-5 mt-5">
        <div class="container py-5 text-center">
            <h1 class="display-3 fw-bold mt-4">Visual Journey</h1>
            <p class="lead opacity-75">Capturing the soul of the forest and the spirit of our retreats.</p>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="d-flex flex-wrap justify-content-center gap-3 mb-5">
                <button class="btn btn-outline-primary rounded-pill px-4 filter-btn active" data-filter="all">All</button>
                <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-filter="interiors">Interiors</button>
                <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-filter="exteriors">Exteriors</button>
                <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-filter="nature">Nature</button>
                <button class="btn btn-outline-primary rounded-pill px-4 filter-btn" data-filter="lifestyle">Lifestyle</button>
            </div>

            <div class="row g-4">
                <div class="col-md-4 col-sm-6 gallery-item-container nature"><div class="gallery-item"><img src="assets/images/hero-bg.png" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container interiors"><div class="gallery-item"><img src="assets/images/cabin-1.png" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container exteriors"><div class="gallery-item"><img src="assets/images/cabin-2.png" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container exteriors"><div class="gallery-item"><img src="assets/images/cabin-3.png" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container nature"><div class="gallery-item"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&q=80&w=800" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container lifestyle"><div class="gallery-item"><img src="https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&q=80&w=800" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container lifestyle"><div class="gallery-item"><img src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&q=80&w=800" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container interiors"><div class="gallery-item"><img src="https://images.unsplash.com/photo-1518732714860-b62714ce0c59?auto=format&fit=crop&q=80&w=800" alt="Gallery"></div></div>
                <div class="col-md-4 col-sm-6 gallery-item-container nature"><div class="gallery-item"><img src="https://images.unsplash.com/photo-1542718610-a1d656d1884c?auto=format&fit=crop&q=80&w=800" alt="Gallery"></div></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container text-center">
            <p class="opacity-75 mb-0">&copy; 2026 Arboria Luxury Retreats. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
