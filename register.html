<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Treetops Treehouse Rental</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css?v=20260508">
</head>

<body class="auth-page d-flex align-items-center justify-content-center min-vh-100 bg-light-subtle"
    style="background: linear-gradient(rgba(20, 83, 45, 0.55), rgba(20, 83, 45, 0.55)), url('https://images.unsplash.com/photo-1510091622857-937d97655097?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat;">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-6">
                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="navbar-brand fs-2 mb-3 d-inline-block">
                            <i class="bi bi-tree-fill"></i>
                            <span>TREETOPS</span>
                        </a>
                        <h3>Join the Sanctuary</h3>
                        <p class="text-muted small">Create your account to save stays and unlock member offers.</p>
                    </div>

                    <form action="#" method="post" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" autocomplete="given-name" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="name@example.com"
                                    autocomplete="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Create a password"
                                    autocomplete="new-password" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="Repeat your password"
                                    autocomplete="new-password" required>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="termsAgree" required>
                                    <label class="form-check-label small" for="termsAgree">
                                        I agree to the <a href="#" class="text-primary">Privacy Policy</a> and <a
                                            href="#" class="text-primary">Terms of Service</a>.
                                    </label>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Register</button>
                                <div class="social-auth-divider mb-3 mt-4">or register with</div>
                                <div class="social-auth-grid mb-4">
                                    <button type="button" class="social-auth-btn google">
                                        <span class="social-auth-mark">G</span>
                                        <span>Google</span>
                                    </button>
                                    <button type="button" class="social-auth-btn apple">
                                        <i class="bi bi-apple"></i>
                                        <span>Apple</span>
                                    </button>
                                </div>
                                <div class="text-center">
                                    <p class="small text-muted mb-0">Already have an account? <a href="login.html"
                                            class="text-primary fw-bold">Sign in</a></p>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js?v=20260508"></script>
</body>

</html>
