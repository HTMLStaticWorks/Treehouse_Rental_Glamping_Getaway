<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Anti-FOUC: apply saved theme/RTL before first paint -->
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
            var d = localStorage.getItem('dir');
            if (d) document.documentElement.setAttribute('dir', d);
        })();
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Arboria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
        <style>
        body {
            background: #f4f7f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .form-control {
            background: #f8f9fa;
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: var(--dark);
        }
        .form-control:focus {
            background: #ffffff;
            border-color: var(--accent);
            color: var(--dark);
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(0,0,0,0.4); }
        .navbar-brand { justify-content: center; width: 100%; color: var(--primary) !important; }
        
        .social-btn {
            color: var(--dark);
            border-color: rgba(0,0,0,0.1);
        }
        .social-btn:hover {
            background: rgba(0,0,0,0.05);
            color: var(--dark);
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] body {
            background: radial-gradient(circle at center, #264b3c 0%, #1a2f26 100%);
        }
        [data-theme="dark"] .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-color: rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        [data-theme="dark"] .form-control {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        [data-theme="dark"] .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        [data-theme="dark"] .form-control::placeholder { color: rgba(255,255,255,0.6); }
        [data-theme="dark"] .navbar-brand { color: white !important; }
        [data-theme="dark"] .text-muted, [data-theme="dark"] .opacity-75 { color: rgba(255,255,255,0.75) !important; opacity: 1 !important; }
        [data-theme="dark"] .social-btn {
            color: white;
            border-color: rgba(255,255,255,0.2);
        }
        [data-theme="dark"] .social-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand text-white fs-2 fw-bold d-flex">
                <i class="bi bi-tree-fill text-accent"></i> ARBORIA
            </a>
            <p class="opacity-75 mt-2">Start your journey into the wild.</p>
        </div>
        <form>
            <div class="row g-3">
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold">First Name</label>
                    <input type="text" class="form-control" placeholder="John">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold">Last Name</label>
                    <input type="text" class="form-control" placeholder="Doe">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control" placeholder="john@example.com">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Create Password</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-accent">Terms & Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Create Account</button>
            <div class="text-center mt-4">
                <p class="small opacity-75">Already have an account? <a href="login.html" class="text-accent text-decoration-none fw-bold">Sign In</a></p>
            </div>
            <hr class="my-4 opacity-25">
            <div class="row g-2">
                <div class="col-6">
                    <button type="button" class="btn btn-outline-dark social-btn w-100 btn-sm py-2 d-flex align-items-center justify-content-center">
                        <i class="bi bi-google me-2"></i> Google
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-outline-dark social-btn w-100 btn-sm py-2 d-flex align-items-center justify-content-center">
                        <i class="bi bi-apple me-2"></i> Apple
                    </button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
