<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Anti-FOUC: apply saved theme/RTL before first paint -->
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
            var d = localStorage.getItem('dir');
            if (d) document.documentElement.setAttribute('dir', d);
        })();
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Arboria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            background: #f4f7f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-control {
            background: #f8f9fa;
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: var(--dark);
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--accent);
            color: var(--dark);
            box-shadow: none;
        }

        .form-control::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        .navbar-brand {
            justify-content: center;
            width: 100%;
            color: var(--primary) !important;
        }

        .social-btn {
            color: var(--dark);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .social-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--dark);
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] body {
            background: #000000 !important;
        }

        [data-theme="dark"] .btn-primary {
            background-color: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #121412 !important;
            /* Force dark text for contrast */
        }

        [data-theme="dark"] .btn-primary:hover {
            background-color: #f1c40f !important;
            border-color: #f1c40f !important;
            color: #121412 !important;
        }

        [data-theme="dark"] .auth-card {
            background: #161616 !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] .form-control {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        [data-theme="dark"] .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        [data-theme="dark"] .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        [data-theme="dark"] .navbar-brand {
            color: white !important;
        }

        [data-theme="dark"] .text-muted,
        [data-theme="dark"] .opacity-75 {
            color: rgba(255, 255, 255, 0.75) !important;
            opacity: 1 !important;
        }

        [data-theme="dark"] .social-btn {
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
        }

        [data-theme="dark"] .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .auth-toggles {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .auth-toggles {
                position: fixed;
                top: 0;
                right: 0;
                padding: 1rem;
                margin-bottom: 0;
                z-index: 1050;
            }

            [dir="rtl"] .auth-toggles {
                right: auto;
                left: 0;
            }
        }
    </style>
</head>

<body>
    <div style="width: 100%; max-width: 450px;">
        <div class="auth-toggles">
            <button id="rtl-toggle" title="Toggle RTL" class="btn btn-light rounded-circle shadow-sm"
                style="width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem;">
                <i class="bi bi-arrow-left-right"></i>
            </button>
            <button id="theme-toggle" title="Toggle Theme" class="btn btn-light rounded-circle shadow-sm"
                style="width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
        <div class="auth-card" style="max-width: 100%;">
            <div class="text-center mb-4">
                <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center">
                    <i class="bi bi-tree-fill text-accent me-2"></i>
                    <span>ARBORIA</span>
                </a>
                <p class="opacity-75 mt-2">Start your journey into the wild.</p>
            </div>
            <form>
                <div class="mb-3">
                    <label class="form-label small fw-bold">First Name</label>
                    <input type="text" class="form-control" placeholder="John">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Last Name</label>
                    <input type="text" class="form-control" placeholder="Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="john@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Create Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="passwordInput" placeholder="••••••••">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmPasswordInput" placeholder="••••••••">
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label small" for="terms">I agree to the <a href="#"
                            class="text-accent">Terms & Privacy Policy</a></label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Create Account</button>
                <div class="text-center mt-4">
                    <p class="small opacity-75">Already have an account? <a href="login.html"
                            class="text-accent text-decoration-none fw-bold">Sign In</a></p>
                </div>
                <hr class="my-4 opacity-25">
                <div class="row g-2">
                    <div class="col-6">
                        <button type="button"
                            class="btn btn-outline-dark social-btn w-100 btn-sm py-2 d-flex align-items-center justify-content-center">
                            <i class="bi bi-google me-2"></i> Google
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button"
                            class="btn btn-outline-dark social-btn w-100 btn-sm py-2 d-flex align-items-center justify-content-center">
                            <i class="bi bi-apple me-2"></i> Apple
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script>
        function togglePasswordVisibility(inputId, buttonId) {
            document.getElementById(buttonId).addEventListener('click', function () {
                const input = document.getElementById(inputId);
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                }
            });
        }
        togglePasswordVisibility('passwordInput', 'togglePassword');
        togglePasswordVisibility('confirmPasswordInput', 'toggleConfirmPassword');
    </script>
    <script src="assets/js/main.js"></script>
</body>

</html>
