<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Anti-FOUC: apply saved theme/RTL before first paint -->
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
            var d = localStorage.getItem('dir');
            if (d) document.documentElement.setAttribute('dir', d);
        })();
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Soon | Arboria Luxury Retreats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1600');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .countdown-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; min-width: 120px; }
        .countdown-num { font-size: 3rem; font-weight: 800; color: var(--accent); display: block; }
        .countdown-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="mb-5">
            <h2 class="navbar-brand text-white fs-1 fw-bold mb-3"><i class="bi bi-tree-fill text-accent"></i> ARBORIA</h2>
            <h1 class="display-3 fw-bold mb-4">Something Magical is Growing.</h1>
            <p class="lead opacity-75 mb-5 mx-auto" style="max-width: 600px;">Our new expansion of glass-fronted treehouses is opening soon. Subscribe to be the first to know and get an exclusive opening discount.</p>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-3 mb-5">
            <div class="countdown-box"><span class="countdown-num">14</span><span class="countdown-label">Days</span></div>
            <div class="countdown-box"><span class="countdown-num">08</span><span class="countdown-label">Hours</span></div>
            <div class="countdown-box"><span class="countdown-num">45</span><span class="countdown-label">Mins</span></div>
            <div class="countdown-box"><span class="countdown-num">22</span><span class="countdown-label">Secs</span></div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="input-group input-group-lg">
                    <input type="email" class="form-control bg-white bg-opacity-10 border-white border-opacity-25 text-white" placeholder="Enter your email">
                    <button class="btn btn-primary px-4" type="button">Notify Me</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
